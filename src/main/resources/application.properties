plc.service.url=http://localhost:8002

# Configuracoes do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/plc_database
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do Hibernate/JPA
# create: cria o schema, destruindo dados anteriores
# create-drop: cria o schema ao iniciar e destroi ao encerrar
# update: atualiza o schema conforme necessario
# validate: valida o schema, nao faz mudancas
spring.jpa.hibernate.ddl-auto=update

# Dialeto do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostra as queries SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracoes adicionais do Hibernate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Pool de conexoes HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000